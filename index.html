<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice Pro - BPM Precision Focus</title>
  <style>
    :root { --primary: #3498db; --success: #2ecc71; --dark: #2c3e50; }
    body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .display-group { background: #f8f9fa; padding: 25px; border-radius: 15px; margin: 20px 0; border: 1px solid #eee; text-align: center; }
    .bpm-main { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
    #debugConsole { text-align: left; background: #1a1a1a; color: #00ff00; padding: 15px; font-family: monospace; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 20px; border-radius: 8px; line-height: 1.6; }
    button { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .correction-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-sub { flex: 1; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>🥁 정밀 BPM 분석 엔진</h2>
  <p style="color: #666; font-size: 14px;">메트로놈 합성 전, 정확한 템포를 먼저 확정합니다.</p>
  
  <input type="file" id="fileInput" accept="audio/*" style="margin: 20px 0; width: 100%;">

  <div class="display-group">
    <span style="font-size: 14px; font-weight: bold; color: #7f8c8d;">분석된 원곡 템포</span>
    <div id="bpmDisplay" class="bpm-main">-</div>
    <span style="color: #95a5a6; font-size: 12px;">Beats Per Minute</span>
    
    <div class="correction-btns">
      <button class="btn-sub" onclick="adjustBpm(0.5)">½ 배 (느리게)</button>
      <button class="btn-sub" onclick="adjustBpm(2)">2배 (빠르게)</button>
    </div>
  </div>

  <div id="debugConsole">--- 오디오 파일을 선택해주세요 ---<br></div>
</div>

<script>
const logEl = document.getElementById('debugConsole');
const bpmDisplay = document.getElementById('bpmDisplay');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let detectedBpm = 0;

function logger(msg) {
  logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function adjustBpm(factor) {
  detectedBpm *= factor;
  bpmDisplay.textContent = detectedBpm.toFixed(1);
  logger(`사용자 수동 교정: ${detectedBpm.toFixed(1)} BPM`);
}

document.getElementById('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  logger(`분석 시작: ${file.name}`);
  const arrayBuffer = await file.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  // 1. 박자 추출용 오프라인 컨텍스트 (저역대 필터 강화)
  const offlineCtx = new OfflineAudioContext(1, audioBuffer.length, audioBuffer.sampleRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;

  const lowpass = offlineCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 120; // 120Hz 이상(목소리, 고음 악기)은 완전히 차단

  source.connect(lowpass);
  lowpass.connect(offlineCtx.destination);
  source.start(0);

  const filteredBuffer = await offlineCtx.startRendering();
  const data = filteredBuffer.getChannelData(0);

  // 2. 에너지 분석 알고리즘
  let peaks = [];
  const sampleRate = audioBuffer.sampleRate;
  const step = 1000; // 분석 해상도
  
  // 전체 평균 에너지 계산
  let sum = 0;
  for(let i=0; i<data.length; i++) sum += Math.abs(data[i]);
  const avgEnergy = sum / data.length;
  const threshold = avgEnergy * 3.5; // 평균보다 3.5배 강한 신호만 박자로 인식

  for (let i = 0; i < data.length; i += step) {
    if (Math.abs(data[i]) > threshold) {
      peaks.push(i);
      i += sampleRate * 0.4; // 0.4초 이내의 연속 피크는 무시 (최대 150 BPM 제한)
    }
  }

  // 3. 자기상관 및 통계 분석
  if (peaks.length < 5) {
    logger("박자 신호 부족. 기본값으로 설정합니다.");
    detectedBpm = 120;
  } else {
    const intervals = [];
    for (let i = 1; i < peaks.length; i++) {
      intervals.push(peaks[i] - peaks[i-1]);
    }
    
    const medianInterval = intervals.sort((a,b) => a-b)[Math.floor(intervals.length/2)];
    detectedBpm = (60 * sampleRate) / medianInterval;
    
    // 발라드 최적화 보정 (70-80 범위를 선호하도록)
    if (detectedBpm > 135) detectedBpm /= 2;
    if (detectedBpm < 55) detectedBpm *= 2;
  }

  bpmDisplay.textContent = detectedBpm.toFixed(1);
  logger(`정밀 분석 완료: ${detectedBpm.toFixed(1)} BPM`);
};
</script>
</body>
</html>
