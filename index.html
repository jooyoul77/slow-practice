<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice - 로컬 독립 실행형</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background: #f4f7f6; }
    .container { max-width: 500px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-bottom: 30px; }
    input[type="file"] { border: 2px dashed #3498db; padding: 20px; width: 80%; border-radius: 10px; cursor: pointer; }
    .controls { margin: 30px 0; }
    select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ddd; }
    button { background: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; width: 100%; transition: 0.3s; }
    button:hover { background: #27ae60; }
    button:disabled { background: #bdc3c7; }
    #progressContainer { display: none; margin-top: 30px; background: #eee; border-radius: 10px; overflow: hidden; }
    #progressBar { height: 15px; background: #3498db; width: 0%; transition: width 0.1s; }
    #status { margin-top: 15px; font-weight: bold; color: #34495e; }
    #downloadBtn { display: none; margin-top: 25px; padding: 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    #debugLog { margin-top: 20px; text-align: left; background: #222; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎸 Slow Practice</h2>
  
  <input type="file" id="fileInput" accept="audio/*">
  
  <div class="controls">
    연습 속도: 
    <select id="speedSelect">
      <option value="0.5">50% (매우 느림)</option>
      <option value="0.7" selected>70% (추천)</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
    </select>
  </div>

  <button id="convertBtn">MP3 변환 및 저장</button>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <p id="status">연습할 곡을 선택해주세요</p>

  <div id="debugLog">--- System Log ---<br></div>
  
  <a id="downloadBtn">⬇ 변환된 파일 다운로드</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>

<script>
const logEl = document.getElementById('debugLog');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const convertBtn = document.getElementById('convertBtn');
const dlBtn = document.getElementById('downloadBtn');

function log(msg) {
  logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

convertBtn.onclick = async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert("파일을 선택해주세요.");

  try {
    convertBtn.disabled = true;
    dlBtn.style.display = 'none';
    document.getElementById('progressContainer').style.display = 'block';
    log(`작업 시작: ${file.name}`);

    // 1. 디코딩
    statusEl.textContent = "오디오 분석 중...";
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    log(`디코딩 성공: ${audioBuffer.duration.toFixed(1)}초`);

    // 2. 브라우저 내장 엔진을 활용한 속도 변환 (SoundTouch 라이브러리 없이 실행)
    const rate = parseFloat(document.getElementById('speedSelect').value);
    statusEl.textContent = "속도 조절 중 (음정 유지)...";
    
    const offlineCtx = new OfflineAudioContext(
      audioBuffer.numberOfChannels,
      audioBuffer.length / rate,
      audioBuffer.sampleRate
    );

    const source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = rate;
    
    // 브라우저 자체 음정 유지 옵션
    if ('preservesPitch' in source) {
      source.preservesPitch = true;
      log("Pitch preservation: Enabled (Native)");
    }

    source.connect(offlineCtx.destination);
    source.start();

    const renderedBuffer = await offlineCtx.startRendering();
    log("속도 변환 완료.");

    // 3. MP3 압축 (LameJS 활용)
    statusEl.textContent = "MP3 압축 중...";
    const mp3Blob = await encodeToMp3(renderedBuffer);

    const url = URL.createObjectURL(mp3Blob);
    dlBtn.href = url;
    dlBtn.download = `slow_${rate}_${file.name}`;
    dlBtn.style.display = 'block';
    statusEl.textContent = "변환 완료! ✅";
    log("다운로드 준비 완료.");
    convertBtn.disabled = false;

  } catch (err) {
    log(`!!! 에러: ${err.message}`);
    convertBtn.disabled = false;
  }
};

async function encodeToMp3(buffer) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
  const mp3Data = [];
  
  const left = buffer.getChannelData(0);
  const right = channels > 1 ? buffer.getChannelData(1) : left;
  const blockSize = 1152;

  for (let i = 0; i < left.length; i += blockSize) {
    const l = new Int16Array(blockSize);
    const r = new Int16Array(blockSize);
    for (let j = 0; j < blockSize; j++) {
      l[j] = left[i + j] * 0x7FFF;
      r[j] = right[i + j] * 0x7FFF;
    }
    const mp3buf = encoder.encodeBuffer(l, r);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);

    if (i % 200000 === 0) {
      progressBar.style.width = (i / left.length * 100) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }
  mp3Data.push(encoder.flush());
  return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
