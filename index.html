<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎸 Slow Practice - MP3 변환기</title>
  <style>
    body {
      font-family: 'Pretendard', Arial, sans-serif;
      background: #f4f4f9;
      text-align: center;
      padding: 40px 20px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #2c3e50; }
    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    button {
      background: #2ecc71;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #27ae60; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      font-weight: bold;
      color: #e67e22;
      min-height: 24px;
    }
    #downloadLink {
      display: none;
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .info {
      font-size: 13px;
      color: #888;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎸 Slow Practice</h1>
  <p>음정 변화 없이 속도만 줄여서 연습하세요!</p>

  <input type="file" id="fileInput" accept="audio/*" />

  <div style="text-align: left; margin-top: 10px;">
    <label for="speedSelect">연습 속도 선택:</label>
    <select id="speedSelect">
      <option value="0.5">50% (매우 느림)</option>
      <option value="0.6">60%</option>
      <option value="0.7" selected>70% (추천)</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="1.0">100% (원래 속도)</option>
    </select>
  </div>

  <button id="convertBtn">MP3 변환 시작</button>

  <p id="status">파일을 선택해 주세요</p>
  <a id="downloadLink">⬇ 변환된 MP3 다운로드</a>

  <div class="info">
    ※ 브라우저에서 직접 변환하므로 파일이 서버로 전송되지 않습니다.<br/>
    ※ 변환 중에는 브라우저가 잠시 멈출 수 있으니 기다려 주세요.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/soundtouchjs@0.1.30/dist/soundtouch.min.js"></script>

<script>
const fileInput = document.getElementById('fileInput');
const speedSelect = document.getElementById('speedSelect');
const convertBtn = document.getElementById('convertBtn');
const statusEl = document.getElementById('status');
const downloadLink = document.getElementById('downloadLink');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

convertBtn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) {
    alert('오디오 파일을 먼저 선택하세요!');
    return;
  }

  try {
    convertBtn.disabled = true;
    downloadLink.style.display = 'none';
    statusEl.textContent = '오디오 분석 중...';

    // 1. 파일 읽기 및 디코딩
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    statusEl.textContent = '속도 조절 작업 중...';
    
    // UI 업데이트를 위해 약간의 지연 후 작업 시작
    setTimeout(async () => {
      const rate = parseFloat(speedSelect.value);
      const processedBuffer = await processAudio(audioBuffer, rate);

      statusEl.textContent = 'MP3 압축 및 인코딩 중...';
      
      setTimeout(() => {
        const mp3Blob = audioBufferToMp3(processedBuffer);
        const url = URL.createObjectURL(mp3Blob);

        downloadLink.href = url;
        downloadLink.download = `slow-${rate}x-${file.name.split('.')[0]}.mp3`;
        downloadLink.style.display = 'block';
        statusEl.textContent = '모든 작업 완료! ✅';
        convertBtn.disabled = false;
      }, 50);
    }, 50);

  } catch (e) {
    console.error(e);
    statusEl.textContent = '오류 발생: ' + e.message;
    convertBtn.disabled = false;
  }
};

// [로직 1] SoundTouch를 이용한 시간 스트레칭 (Time Stretching)
function processAudio(buffer, rate) {
  return new Promise(resolve => {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    
    const st = new soundtouch.SoundTouch(sampleRate);
    st.tempo = rate;

    const source = {
      extract: function(target, numFrames, offset) {
        for (let i = 0; i < numFrames; i++) {
          for (let ch = 0; ch < numChannels; ch++) {
            target[i * numChannels + ch] = buffer.getChannelData(ch)[i + offset];
          }
        }
        return Math.min(numFrames, buffer.length - offset);
      }
    };

    const filter = new soundtouch.SimpleFilter(source, st);
    const outLength = Math.ceil(buffer.length / rate);
    const outputData = new Float32Array(outLength * numChannels);
    
    let framesExtracted = 0;
    let totalFrames = 0;
    const BUFFER_SIZE = 1024;
    const tempBuffer = new Float32Array(BUFFER_SIZE * numChannels);

    while (true) {
      framesExtracted = filter.extract(tempBuffer, BUFFER_SIZE);
      if (framesExtracted === 0) break;
      outputData.set(tempBuffer.subarray(0, framesExtracted * numChannels), totalFrames * numChannels);
      totalFrames += framesExtracted;
    }

    const outBuffer = audioCtx.createBuffer(numChannels, totalFrames, sampleRate);
    for (let ch = 0; ch < numChannels; ch++) {
      const channelData = outBuffer.getChannelData(ch);
      for (let i = 0; i < totalFrames; i++) {
        channelData[i] = outputData[i * numChannels + ch];
      }
    }
    resolve(outBuffer);
  });
}

// [로직 2] lamejs를 이용한 MP3 인코딩
function audioBufferToMp3(buffer) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
  const mp3Data = [];

  const sampleBlockSize = 1152;
  const left = buffer.getChannelData(0);
  const right = channels > 1 ? buffer.getChannelData(1) : left;

  for (let i = 0; i < left.length; i += sampleBlockSize) {
    const leftChunk = left.subarray(i, i + sampleBlockSize);
    const rightChunk = right.subarray(i, i + sampleBlockSize);
    
    const l = new Int16Array(leftChunk.length);
    const r = new Int16Array(rightChunk.length);
    for (let j = 0; j < leftChunk.length; j++) {
      l[j] = leftChunk[j] < 0 ? leftChunk[j] * 0x8000 : leftChunk[j] * 0x7FFF;
      r[j] = rightChunk[j] < 0 ? rightChunk[j] * 0x8000 : rightChunk[j] * 0x7FFF;
    }

    const mp3buf = mp3encoder.encodeBuffer(l, r);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);
  }

  const fb = mp3encoder.flush();
  if (fb.length > 0) mp3Data.push(fb);

  return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>

</body>
</html>
