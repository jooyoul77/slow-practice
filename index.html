<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice Pro - Fix Mode</title>
  <style>
    :root { --primary: #3498db; --success: #2ecc71; --dark: #2c3e50; }
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
    .info-badge { display: inline-flex; align-items: center; gap: 8px; background: #ebf5ff; color: var(--primary); padding: 10px 20px; border-radius: 30px; font-weight: bold; margin-bottom: 20px; display: none; }
    #debugConsole { text-align: left; background: #1a1a1a; color: #00ff00; padding: 15px; font-family: monospace; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 20px; border-radius: 8px; line-height: 1.6; }
    #progressArea { margin: 20px 0; display: none; }
    .pg-bar { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; }
    .pg-fill { background: var(--success); width: 0%; height: 100%; transition: width 0.2s; }
    button { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .download-link { display: none; margin-top: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: bold; display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎸 Slow Practice <span style="font-size: 0.6em; color: var(--primary);">V2.1</span></h2>
  
  <input type="file" id="fileInput" accept="audio/*" style="margin-bottom: 20px; width: 100%;">

  <div id="bpmBadge" class="info-badge">
    ⏱ 정밀 BPM: <span id="bpmValue">-</span>
  </div>
  
  <div style="margin-bottom:25px; text-align:left;">
    <label style="font-size:13px; font-weight:bold;">연습 속도</label>
    <select id="speedSelect" style="width:100%; padding:10px; margin-top:5px;">
      <option value="0.7">70% (추천)</option>
      <option value="0.8" selected>80%</option>
      <option value="0.9">90%</option>
    </select>
    <p id="targetBpm" style="font-size:12px; color:var(--primary); margin-top:5px;"></p>
  </div>

  <button id="convertBtn">프로세스 시작</button>

  <div id="progressArea">
    <div class="pg-bar"><div id="pgFill" class="pg-fill"></div></div>
    <p id="statusMsg" style="font-size:12px; color:#666; margin-top:5px;">분석 중...</p>
  </div>

  <div id="debugConsole">--- System Ready ---<br></div>
  <a id="dlLink" class="download-link">⬇ MP3 다운로드</a>
</div>

<script src="https://unpkg.com/web-audio-beat-detector@8.2.11/build/es5/bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>

<script>
const logEl = document.getElementById('debugConsole');
const pgFill = document.getElementById('pgFill');
const statusMsg = document.getElementById('statusMsg');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let currentBpm = 0;

function logger(msg, isError = false) {
  const color = isError ? 'color: #ff4d4d;' : '';
  logEl.innerHTML += `<span style="${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  logger(`파일 감지: ${file.name}`);
  
  try {
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    
    logger("정밀 BPM 분석 알고리즘 가동...");

    // 라이브러리 존재 여부 및 호출 방식 디버깅
    if (typeof webAudioBeatDetector !== 'undefined' && webAudioBeatDetector.analyze) {
        currentBpm = await webAudioBeatDetector.analyze(audioBuffer);
        logger(`분석 완료: ${currentBpm.toFixed(2)} BPM`);
    } else {
        throw new Error("라이브러리는 로드되었으나 analyze 함수를 찾을 수 없습니다.");
    }
    
    document.getElementById('bpmBadge').style.display = 'inline-flex';
    document.getElementById('bpmValue').textContent = Math.round(currentBpm);
    updateTargetBpm();
  } catch (err) {
    logger(`에러: ${err.message}`, true);
    logger("임시: 기본 피크 검출 방식으로 전환합니다.");
    currentBpm = 75; // 분석 실패 시 임시값 (엑소 첫눈 기준)
  }
};

function updateTargetBpm() {
  const rate = document.getElementById('speedSelect').value;
  document.getElementById('targetBpm').textContent = `🎯 예상 속도: ${Math.round(currentBpm * rate)} BPM`;
}

document.getElementById('convertBtn').onclick = async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const rate = parseFloat(document.getElementById('speedSelect').value);
  
  document.getElementById('convertBtn').disabled = true;
  document.getElementById('progressArea').style.display = 'block';
  
  logger("렌더링 시작...");
  const arrayBuffer = await file.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  
  const offlineCtx = new OfflineAudioContext(audioBuffer.numberOfChannels, audioBuffer.length / rate, audioBuffer.sampleRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.playbackRate.value = rate;
  if ('preservesPitch' in source) source.preservesPitch = true;
  source.connect(offlineCtx.destination);
  source.start();

  const renderedBuffer = await offlineCtx.startRendering();
  
  const mp3Blob = await encodeMp3(renderedBuffer);
  const url = URL.createObjectURL(mp3Blob);
  const dl = document.getElementById('dlLink');
  dl.href = url;
  dl.download = `slow_${rate}_${file.name}`;
  dl.style.display = 'block';
  
  statusMsg.textContent = "변환 완료!";
  logger("파일 생성 완료.");
  document.getElementById('convertBtn').disabled = false;
};

async function encodeMp3(buffer) {
  const encoder = new lamejs.Mp3Encoder(buffer.numberOfChannels, buffer.sampleRate, 128);
  const mp3Data = [];
  const left = buffer.getChannelData(0);
  const right = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : left;
  for (let i = 0; i < left.length; i += 1152) {
    const l = new Int16Array(1152);
    const r = new Int16Array(1152);
    for (let j = 0; j < 1152; j++) {
      l[j] = left[i+j] * 0x7FFF;
      r[j] = right[i+j] * 0x7FFF;
    }
    const mp3buf = encoder.encodeBuffer(l, r);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);
    if (i % 200000 === 0) {
      pgFill.style.width = (i / left.length * 100) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }
  mp3Data.push(encoder.flush());
  pgFill.style.width = '100%';
  return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
