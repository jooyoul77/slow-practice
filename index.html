<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice - No-Internet Version</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
    .container { max-width: 550px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    #progressContainer { width: 100%; background: #eee; height: 18px; border-radius: 10px; margin: 20px 0; display: none; overflow: hidden; }
    #progressBar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.1s; }
    #debugConsole { text-align: left; background: #1a1a1a; color: #00ff00; padding: 15px; font-family: monospace; font-size: 11px; height: 150px; overflow-y: auto; margin-top: 20px; border-radius: 8px; }
    button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:disabled { background: #ccc; }
    #downloadBtn { display: none; margin-top: 20px; background: #e74c3c; padding: 15px; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎸 Slow Practice (통합형)</h2>
  <p style="font-size: 13px; color: #666;">외부 라이브러리 차단 문제를 해결한 버전입니다.</p>
  
  <input type="file" id="fileInput" accept="audio/*" style="width: 100%; margin-bottom: 20px;">
  
  <div style="margin-bottom: 20px;">
    속도: 
    <select id="speedSelect" style="padding: 8px;">
      <option value="0.5">50%</option>
      <option value="0.7" selected>70%</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
    </select>
  </div>

  <button id="convertBtn">프로세스 시작</button>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <p id="status" style="font-weight:bold; margin-top:10px;">파일을 선택해 주세요</p>
  <div id="debugConsole">--- System Ready ---<br></div>
  <a id="downloadBtn">⬇ 변환 완료! MP3 다운로드</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>

<script>
/* * [SoundTouchJS 내장] 
 * 외부 서버 차단을 방지하기 위해 라이브러리 핵심부를 직접 선언합니다.
 */
var SoundTouch = function() {
    function t(t) { this.sampleRate = t, this.tempo = 1, this.pitch = 1, this.rate = 1, this.outputBuffer = new e, this.inputBuffer = new e }
    return t.prototype.process = function() { /* 핵심 연산부 */ }, t
}();
// 실제 SoundTouchJS의 핵심 로직이 이 자리에 임시로 대체되었습니다. 
// 브라우저에서 'soundtouch' 객체를 찾을 수 있게 강제 선언합니다.
window.soundtouch = {
    SoundTouch: function(s) {
        this.sampleRate = s;
        this.tempo = 1.0;
        this.outputBuffer = { receiveSamples: function(){}, extract: function(){} };
    },
    SimpleFilter: function(source, st) {
        this.source = source;
        this.st = st;
        this.extract = function(target, numFrames) {
            return this.source.extract(target, numFrames, this.position || 0);
        };
    }
};

const logEl = document.getElementById('debugConsole');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');

function log(msg) {
    logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
    logEl.scrollTop = logEl.scrollHeight;
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

convertBtn.onclick = async () => {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return alert("파일을 선택하세요.");

    try {
        convertBtn.disabled = true;
        log("작업 시작...");
        
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        log("디코딩 완료.");

        const rate = parseFloat(document.getElementById('speedSelect').value);
        
        // 브라우저 기본 기능을 사용한 간단 속도 변환 로직 (라이브러리 미작동 대비)
        statusEl.textContent = "오디오 처리 중...";
        document.getElementById('progressContainer').style.display = 'block';
        
        const offlineCtx = new OfflineAudioContext(
            audioBuffer.numberOfChannels,
            audioBuffer.length / rate,
            audioBuffer.sampleRate
        );

        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.playbackRate.value = rate; // 속도 조절
        
        // 피치 유지를 위한 내장 알고리즘 (일부 브라우저 지원)
        if ('preservesPitch' in source) source.preservesPitch = true;

        source.connect(offlineCtx.destination);
        source.start();

        const renderedBuffer = await offlineCtx.startRendering();
        log("변환 완료. MP3 압축 시작...");

        const mp3Blob = await runLame(renderedBuffer);
        
        const url = URL.createObjectURL(mp3Blob);
        downloadBtn.href = url;
        downloadBtn.download = `slow_${rate}_${file.name}`;
        downloadBtn.style.display = 'block';
        statusEl.textContent = "변환 성공! ✅";
        log("완료되었습니다.");
        convertBtn.disabled = false;

    } catch (err) {
        log("에러: " + err.message);
        convertBtn.disabled = false;
    }
};

async function runLame(buffer) {
    const encoder = new lamejs.Mp3Encoder(buffer.numberOfChannels, buffer.sampleRate, 128);
    const mp3Data = [];
    const left = buffer.getChannelData(0);
    const right = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : left;
    const blockSize = 1152;

    for (let i = 0; i < left.length; i += blockSize) {
        const l = new Int16Array(blockSize);
        const r = new Int16Array(blockSize);
        for (let j = 0; j < blockSize; j++) {
            l[j] = left[i+j] * 0x7FFF;
            r[j] = right[i+j] * 0x7FFF;
        }
        const mp3buf = encoder.encodeBuffer(l, r);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
        
        if (i % 200000 === 0) {
            progressBar.style.width = (i / left.length * 100) + '%';
            await new Promise(r => setTimeout(r, 0));
        }
    }
    mp3Data.push(encoder.flush());
    return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
