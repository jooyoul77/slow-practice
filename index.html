<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎸 BPM Master - 고속 변환 모드</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; max-width: 450px; margin: 0 auto; border: 1px solid #333; }
        .bpm-compare { display: flex; align-items: center; justify-content: space-around; background: #000; padding: 20px; border-radius: 15px; margin: 20px 0; }
        .bpm-box { text-align: center; }
        .bpm-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .bpm-value { font-size: 2rem; font-weight: 900; color: #e94560; }
        input[type="number"] { background: none; border: none; border-bottom: 2px solid #e94560; color: #fff; width: 70px; text-align: center; font-size: 2rem; font-weight: 900; outline: none; }
        .speed-slider { width: 100%; height: 10px; border-radius: 5px; background: #333; outline: none; margin: 25px 0; -webkit-appearance: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 25px; height: 25px; background: #e94560; border-radius: 50%; cursor: pointer; }
        .play-btn { width: 100%; padding: 18px; border-radius: 12px; border: none; background: #e94560; color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .play-btn:disabled { background: #444; opacity: 0.5; }
        #loading { margin-top: 15px; color: #ff6b6b; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎸 BPM Speed Master</h2>
        <input type="file" id="audioFile" accept="audio/*" style="margin: 20px 0;">

        <div class="bpm-compare">
            <div class="bpm-box">
                <div class="bpm-label">원곡 BPM</div>
                <input type="number" id="baseBpm" value="120">
            </div>
            <div style="font-size: 1.5rem; color: #444;">▶</div>
            <div class="bpm-box">
                <div class="bpm-label">변환 후 BPM</div>
                <div id="targetBpm" class="bpm-value">120</div>
            </div>
        </div>

        <div style="font-size: 1.1rem;">설정 속도: <span id="speedPercent" style="color:#e94560; font-weight:bold;">100</span>%</div>
        <input type="range" id="speedSlider" class="speed-slider" min="50" max="150" value="100">

        <button id="playBtn" class="play-btn" disabled>음원을 선택하세요</button>
        <div id="loading"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/soundtouch-js/0.1.30/soundtouch.min.js"></script>

    <script>
        // 엔진이 제대로 로드되었는지 확인하는 안전장치
        window.onload = () => {
            if (typeof SoundTouch === 'undefined') {
                document.getElementById('loading').innerText = "❌ 엔진 로드 실패. 인터넷 연결을 확인하세요.";
            }
        };

        let audioCtx, origBuf, stretchBuf, source, isPlaying = false;
        let speed = 1.0;

        const el = {
            file: document.getElementById('audioFile'),
            baseBpm: document.getElementById('baseBpm'),
            targetBpm: document.getElementById('targetBpm'),
            slider: document.getElementById('speedSlider'),
            speedTxt: document.getElementById('speedPercent'),
            playBtn: document.getElementById('playBtn'),
            loading: document.getElementById('loading')
        };

        el.file.onchange = async (e) => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            el.loading.innerText = "🔍 파일 분석 중...";
            const ab = await e.target.files[0].arrayBuffer();
            origBuf = await audioCtx.decodeAudioData(ab);
            process();
        };

        el.slider.oninput = () => {
            speed = el.slider.value / 100;
            el.speedTxt.innerText = el.slider.value;
            el.targetBpm.innerText = Math.round(el.baseBpm.value * speed);
        };

        el.slider.onchange = process;
        el.baseBpm.oninput = () => el.targetBpm.innerText = Math.round(el.baseBpm.value * speed);

        async function process() {
            if(!origBuf) return;
            el.playBtn.disabled = true;
            el.loading.innerText = "⏳ 변환 엔진 가동 중...";
            
            await new Promise(r => setTimeout(r, 50));
            stretchBuf = await timeStretch(origBuf, speed);
            
            el.playBtn.disabled = false;
            el.playBtn.innerText = "▶ 재생 시작";
            el.loading.innerText = "✅ 준비 완료!";
        }

        function timeStretch(buf, tempo) {
            return new Promise((resolve) => {
                const st = new SoundTouch();
                st.tempo = tempo;
                const outLen = Math.round(buf.length / tempo);
                const outBuf = audioCtx.createBuffer(buf.numberOfChannels, outLen, buf.sampleRate);
                
                for (let ch = 0; ch < buf.numberOfChannels; ch++) {
                    const input = buf.getChannelData(ch);
                    const output = outBuf.getChannelData(ch);
                    const src = { extract: (target, num, pos) => {
                        for(let i=0; i<num && (pos+i)<input.length; i++) target[i] = input[pos+i];
                        return Math.min(num, input.length - pos);
                    }};
                    const filter = new SimpleFilter(src, st);
                    let outPos = 0; const tmp = new Float32Array(4096);
                    while (outPos < outLen) {
                        const f = filter.extract(tmp, 4096);
                        if (f === 0) break;
                        output.set(tmp.subarray(0, f), outPos);
                        outPos += f;
                    }
                }
                resolve(outBuf);
            });
        }

        el.playBtn.onclick = () => {
            if(isPlaying) {
                source.stop();
                isPlaying = false;
                el.playBtn.innerText = "▶ 재생 시작";
            } else {
                source = audioCtx.createBufferSource();
                source.buffer = stretchBuf;
                source.connect(audioCtx.destination);
                source.start();
                isPlaying = true;
                el.playBtn.innerText = "⏸ 정지";
                source.onended = () => { isPlaying = false; el.playBtn.innerText = "▶ 재생 시작"; };
            }
        };
    </script>
</body>
</html>
