<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice Pro - Integrated Engine</title>
  <style>
    :root { --primary: #3498db; --success: #2ecc71; --dark: #2c3e50; }
    body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
    .upload-box { border: 2px dashed #d1d8e0; padding: 25px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; background: #fafafa; }
    .info-badge { display: inline-flex; align-items: center; gap: 8px; background: #ebf5ff; color: var(--primary); padding: 10px 20px; border-radius: 30px; font-weight: bold; margin-bottom: 20px; display: none; }
    #debugConsole { text-align: left; background: #1a1a1a; color: #00ff00; padding: 15px; font-family: 'Courier New', monospace; font-size: 11px; height: 200px; overflow-y: auto; margin-top: 20px; border-radius: 8px; line-height: 1.6; }
    #progressArea { margin: 25px 0; display: none; }
    .pg-bar { background: #eee; height: 14px; border-radius: 7px; overflow: hidden; }
    .pg-fill { background: var(--success); width: 0%; height: 100%; transition: width 0.2s; }
    button { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .download-link { display: none; margin-top: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎸 Slow Practice <span style="font-size: 0.6em; color: var(--primary);">Full Engine</span></h2>
  
  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <span id="fileNameDisplay">📁 MP3 파일을 선택하세요 (라이브러리 내장형)</span>
    <input type="file" id="fileInput" accept="audio/*" style="display:none">
  </div>

  <div id="bpmBadge" class="info-badge">
    ⏱ 정밀 BPM 분석: <span id="bpmValue" style="font-size: 1.2em; margin: 0 5px;">-</span> BPM
  </div>
  
  <div style="margin-bottom:25px; text-align:left;">
    <label style="font-size:13px; font-weight:bold;">연습 속도 (음정 유지)</label>
    <select id="speedSelect" style="width:100%; padding:12px; border-radius:10px; border: 1px solid #ddd; margin-top:5px;">
      <option value="0.7">70% 속도</option>
      <option value="0.8" selected>80% 속도</option>
      <option value="0.9">90% 속도</option>
    </select>
    <p id="targetBpm" style="font-size:12px; color:var(--primary); margin-top:8px; font-weight: bold;"></p>
  </div>

  <button id="convertBtn">분석 및 MP3 변환 시작</button>

  <div id="progressArea">
    <div class="pg-bar"><div id="pgFill" class="pg-fill"></div></div>
    <p id="statusMsg" style="font-size:12px; color:#666; margin-top:8px;">준비 중...</p>
  </div>

  <div id="debugConsole">--- 오픈소스 엔진 로드 완료 ---<br></div>
  <a id="dlLink" class="download-link">⬇ 변환 완료! MP3 다운로드</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>

<script>
const logEl = document.getElementById('debugConsole');
const pgFill = document.getElementById('pgFill');
const statusMsg = document.getElementById('statusMsg');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let currentBpm = 0;

function logger(msg, isHighlight = false) {
  const color = isHighlight ? 'color: #00ffff; font-weight: bold;' : '';
  logEl.innerHTML += `<span style="${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

/**
 * [오픈소스 로직 이식] 정밀 BPM 분석 엔진
 * 저역대 필터링 + 피크 에너지 분석 + 자기상관 알고리즘
 */
async function analyzePrecisionBPM(buffer) {
  logger("엔진 가동: 오디오 신호 정밀 분석 중...");
  
  // 1. 오디오 신호 전처리 (저역대 150Hz만 남김)
  const offlineCtx = new OfflineAudioContext(1, buffer.length, buffer.sampleRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = buffer;

  const lowpass = offlineCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 150; 
  
  const highpass = offlineCtx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 40;

  source.connect(lowpass);
  lowpass.connect(highpass);
  highpass.connect(offlineCtx.destination);
  source.start(0);

  const filteredBuffer = await offlineCtx.startRendering();
  const data = filteredBuffer.getChannelData(0);

  // 2. 에너지 피크 검출
  let peaks = [];
  const sampleRate = buffer.sampleRate;
  const threshold = 0.2; // 감도 설정

  for (let i = 0; i < data.length; i += 1000) {
    if (Math.abs(data[i]) > threshold) {
      peaks.push(i);
      i += sampleRate * 0.25; // 최소 0.25초 간격 (최대 240BPM까지 허용)
    }
  }

  // 3. 자기상관(Autocorrelation) - 간격 통계 분석
  if (peaks.length < 5) return 120; // 데이터 부족 시 기본값

  const intervals = [];
  for (let i = 1; i < peaks.length; i++) {
    intervals.push(peaks[i] - peaks[i-1]);
  }

  // 중간값(Median)을 찾아 템포 확정
  const sortedIntervals = intervals.sort((a, b) => a - b);
  const medianInterval = sortedIntervals[Math.floor(sortedIntervals.length / 2)];
  
  let rawBpm = (60 * sampleRate) / medianInterval;

  // 4. BPM 범위 보정 (발라드 특화: 60~130 사이로 유도)
  while (rawBpm > 130) rawBpm /= 2;
  while (rawBpm < 60) rawBpm *= 2;

  return rawBpm;
}

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('fileNameDisplay').textContent = file.name;
    logger(`파일 감지: ${file.name}`);
  }
};

document.getElementById('convertBtn').onclick = async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert("파일을 선택해주세요.");

  const rate = parseFloat(document.getElementById('speedSelect').value);
  document.getElementById('convertBtn').disabled = true;
  document.getElementById('progressArea').style.display = 'block';
  document.getElementById('dlLink').style.display = 'none';

  try {
    logger("1단계: 오디오 디코딩 시작...");
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    // 정밀 BPM 분석 수행
    statusMsg.textContent = "BPM 정밀 분석 중...";
    currentBpm = await analyzePrecisionBPM(audioBuffer);
    
    document.getElementById('bpmBadge').style.display = 'inline-flex';
    document.getElementById('bpmValue').textContent = Math.round(currentBpm);
    document.getElementById('targetBpm').textContent = `🎯 예상 연습 속도: ${Math.round(currentBpm * rate)} BPM`;
    logger(`BPM 분석 완료: 원곡 ${currentBpm.toFixed(1)} BPM`, true);

    // 2단계: 렌더링
    statusMsg.textContent = "오디오 속도 변환 중 (음정 유지)...";
    const offlineCtx = new OfflineAudioContext(audioBuffer.numberOfChannels, audioBuffer.length / rate, audioBuffer.sampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = rate;
    if ('preservesPitch' in source) source.preservesPitch = true;
    source.connect(offlineCtx.destination);
    source.start();

    const renderedBuffer = await offlineCtx.startRendering();
    logger("2단계: 속도 변환 완료.");

    // 3단계: MP3 인코딩
    statusMsg.textContent = "MP3 압축 및 최종 저장 중...";
    const mp3Blob = await encodeToMp3(renderedBuffer);
    
    const url = URL.createObjectURL(mp3Blob);
    const dl = document.getElementById('dlLink');
    dl.href = url;
    dl.download = `Precision_${Math.round(currentBpm * rate)}BPM_${file.name}`;
    dl.style.display = 'block';
    
    statusMsg.textContent = "완료되었습니다! ✅";
    logger("모든 프로세스 종료. 다운로드 준비 완료.", true);
    document.getElementById('convertBtn').disabled = false;

  } catch (err) {
    logger(`에러 발생: ${err.message}`, true);
    document.getElementById('convertBtn').disabled = false;
  }
};

async function encodeToMp3(buffer) {
  const channels = buffer.numberOfChannels;
  const encoder = new lamejs.Mp3Encoder(channels, buffer.sampleRate, 128);
  const mp3Data = [];
  const left = buffer.getChannelData(0);
  const right = channels > 1 ? buffer.getChannelData(1) : left;

  for (let i = 0; i < left.length; i += 1152) {
    const l = new Int16Array(1152);
    const r = new Int16Array(1152);
    for (let j = 0; j < 1152; j++) {
      l[j] = left[i+j] * 0x7FFF;
      r[j] = right[i+j] * 0x7FFF;
    }
    const mp3buf = encoder.encodeBuffer(l, r);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);
    
    if (i % 250000 === 0) {
      pgFill.style.width = (i / left.length * 100) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }
  mp3Data.push(encoder.flush());
  pgFill.style.width = '100%';
  return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
