<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎸 BPM Master - 독립 실행형</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; max-width: 450px; margin: 20px auto; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-weight: 900; background: linear-gradient(90deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        
        .bpm-display { display: flex; align-items: center; justify-content: space-around; background: #0f0f1b; padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid #2a2a40; }
        .bpm-label { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
        .bpm-value { font-size: 2.2rem; font-weight: 900; color: #e94560; }
        input[type="number"] { background: none; border: none; border-bottom: 2px solid #e94560; color: #fff; width: 80px; text-align: center; font-size: 2rem; font-weight: 900; outline: none; }
        
        .speed-slider { width: 100%; height: 8px; border-radius: 5px; background: #333; outline: none; margin: 25px 0; -webkit-appearance: none; cursor: pointer; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #e94560; border-radius: 50%; border: 3px solid #fff; }
        
        .play-btn { width: 100%; padding: 18px; border-radius: 12px; border: none; background: linear-gradient(135deg, #e94560, #950740); color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .play-btn:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
        
        #status { margin-top: 20px; color: #ff6b6b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎸 BPM Master</h1>
        <input type="file" id="audioFile" accept="audio/*">

        <div class="bpm-display">
            <div class="bpm-box">
                <div class="bpm-label">원곡 BPM</div>
                <input type="number" id="baseBpm" value="120">
            </div>
            <div style="font-size: 1.5rem; color: #444;">▶</div>
            <div class="bpm-box">
                <div class="bpm-label">변환 후 BPM</div>
                <div id="targetBpm" class="bpm-value">120</div>
            </div>
        </div>

        <div style="margin:10px 0;">재생 속도: <span id="speedVal" style="color:#e94560; font-weight:bold;">100</span>%</div>
        <input type="range" id="speedSlider" class="speed-slider" min="50" max="150" value="100">

        <button id="playBtn" class="play-btn" disabled>파일을 선택해 주세요</button>
        <div id="status">연습할 곡을 올려보세요!</div>
    </div>

    <script>
        /* SoundTouch.js Library (Embedded) */
        !function(t,n){"object"==typeof exports&&"undefined"!=typeof module?n(exports):"function"==typeof define&&define.amd?define(["exports"],n):n((t=t||self).SoundTouch={})}(this,function(t){"use strict";function n(){this.rate=1,this.tempo=1,this.pitch=1,this.inputBuffer=new e,this.outputBuffer=new e,this.onstatusBufferFull=function(){},this.onstatusBufferEmpty=function(){}}var e=function(){this.clear()};e.prototype.clear=function(){this.samples=new Float32Array(0),this.startIndex=0,this.endIndex=0},e.prototype.putSamples=function(t,n,e){var i=this.endIndex+e;i>this.samples.length&&(this.samples=function(t,n){var e=new Float32Array(n);return e.set(t),e}(this.samples,Math.max(2*this.samples.length,i))),this.samples.set(t.subarray(n,n+e),this.endIndex),this.endIndex=i},e.prototype.receiveSamples=function(t,n){var e=Math.min(n,this.frameCount);t.set(this.samples.subarray(this.startIndex,this.startIndex+e)),this.startIndex+=e,this.startIndex===this.endIndex&&this.clear()},Object.defineProperty(e.prototype,"frameCount",{get:function(){return this.endIndex-this.startIndex}});var i=function(t,n){this.source=t,this.soundTouch=n,this.position=0};i.prototype.extract=function(t,n){var e=this.soundTouch.outputBuffer;for(this.soundTouch.process();e.frameCount<n;){var i=Math.min(4096,1e6);if(0===(i=this.source.extract(this.soundTouch.inputBuffer.samples,i,this.position)))break;this.soundTouch.inputBuffer.putSamples(this.soundTouch.inputBuffer.samples,0,i),this.position+=i,this.soundTouch.process()}return e.receiveSamples(t,n),Math.min(n,t.length)};
        
        /* 메인 로직 시작 */
        window.SoundTouch = n; window.SimpleFilter = i; // 글로벌 등록
        
        let audioCtx, origBuf, stretchBuf, source, isPlaying = false, speed = 1.0;
        const el = {
            file: document.getElementById('audioFile'),
            baseBpm: document.getElementById('baseBpm'),
            targetBpm: document.getElementById('targetBpm'),
            slider: document.getElementById('speedSlider'),
            speedTxt: document.getElementById('speedVal'),
            playBtn: document.getElementById('playBtn'),
            status: document.getElementById('status')
        };

        el.file.onchange = async (e) => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            el.status.innerText = "🔍 분석 중...";
            const ab = await e.target.files[0].arrayBuffer();
            origBuf = await audioCtx.decodeAudioData(ab);
            const analyzedBpm = detectBPM(origBuf);
            el.baseBpm.value = analyzedBpm;
            updateDisplay();
            process();
        };

        function detectBPM(buffer) {
            const data = buffer.getChannelData(0);
            const step = 1000, peaks = [];
            for (let i = 0; i < data.length; i += step) {
                let max = 0;
                for (let j = 0; j < step && i + j < data.length; j++) {
                    let vol = Math.abs(data[i + j]); if (vol > max) max = vol;
                }
                if (max > 0.3) peaks.push(i);
            }
            if (peaks.length < 2) return 120;
            let intervals = [];
            for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i-1]);
            const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
            let bpm = Math.round(60 / (avgInterval / buffer.sampleRate));
            while (bpm < 70) bpm *= 2; while (bpm > 170) bpm /= 2;
            return bpm;
        }

        function updateDisplay() {
            speed = el.slider.value / 100;
            el.speedTxt.innerText = el.slider.value;
            el.targetBpm.innerText = Math.round(el.baseBpm.value * speed);
        }

        el.slider.oninput = updateDisplay;
        el.slider.onchange = process;
        el.baseBpm.oninput = updateDisplay;

        async function process() {
            if(!origBuf) return;
            el.playBtn.disabled = true;
            el.status.innerText = "⏳ 고속 변환 중...";
            await new Promise(r => setTimeout(r, 50));
            stretchBuf = await timeStretch(origBuf, speed);
            el.playBtn.disabled = false;
            el.playBtn.innerText = "▶ 재생 시작";
            el.status.innerText = "✅ 연습 준비 완료!";
        }

        function timeStretch(buf, tempo) {
            return new Promise((resolve) => {
                const st = new window.SoundTouch();
                st.tempo = tempo;
                const outLen = Math.round(buf.length / tempo);
                const outBuf = audioCtx.createBuffer(buf.numberOfChannels, outLen, buf.sampleRate);
                for (let ch = 0; ch < buf.numberOfChannels; ch++) {
                    const input = buf.getChannelData(ch);
                    const output = outBuf.getChannelData(ch);
                    const src = { extract: (target, num, pos) => {
                        for(let i=0; i<num && (pos+i)<input.length; i++) target[i] = input[pos+i];
                        return Math.min(num, input.length - pos);
                    }};
                    const filter = new window.SimpleFilter(src, st);
                    let outPos = 0; const tmp = new Float32Array(4096);
                    while (outPos < outLen) {
                        const f = filter.extract(tmp, 4096);
                        if (f === 0) break;
                        output.set(tmp.subarray(0, f), outPos);
                        outPos += f;
                    }
                }
                resolve(outBuf);
            });
        }

        el.playBtn.onclick = () => {
            if(isPlaying) { source.stop(); isPlaying = false; el.playBtn.innerText = "▶ 재생 시작"; }
            else {
                source = audioCtx.createBufferSource();
                source.buffer = stretchBuf;
                source.connect(audioCtx.destination);
                source.start(); isPlaying = true; el.playBtn.innerText = "⏸ 정지";
                source.onended = () => { isPlaying = false; el.playBtn.innerText = "▶ 재생 시작"; };
            }
        };
    </script>
</body>
</html>
