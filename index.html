<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎸 Slow Practice - 느리게 연습하기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #8892b0;
            font-size: 1rem;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .upload-area {
            border: 2px dashed rgba(233, 69, 96, 0.5);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }
        
        .upload-area.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #8892b0;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 0.85rem;
            color: #5a6a8a;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-info {
            display: none;
            background: rgba(233, 69, 96, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        
        .file-info.show {
            display: block;
        }
        
        .file-name {
            font-weight: 700;
            color: #e94560;
            word-break: break-all;
        }
        
        .speed-section {
            display: none;
        }
        
        .speed-section.show {
            display: block;
        }
        
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .speed-display {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .speed-value {
            font-size: 4rem;
            font-weight: 900;
            color: #e94560;
            line-height: 1;
        }
        
        .speed-unit {
            font-size: 1.5rem;
            color: #8892b0;
        }
        
        .speed-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .speed-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(233, 69, 96, 0.3);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .speed-btn:hover {
            background: #e94560;
            transform: scale(1.1);
        }
        
        .speed-btn:active {
            transform: scale(0.95);
        }
        
        .speed-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        
        .speed-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        
        .preset-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .preset-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #8892b0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .preset-btn:hover, .preset-btn.active {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }
        
        .player-section {
            display: none;
        }
        
        .player-section.show {
            display: block;
        }
        
        .play-btn {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        
        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .play-btn.playing {
            background: linear-gradient(135deg, #ff6b6b, #ffa502);
        }
        
        .download-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .download-btn:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s ease;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8892b0;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            color: #8892b0;
            font-size: 0.9rem;
        }
        
        .status.processing {
            color: #ffa502;
        }
        
        .status.error {
            color: #ff4757;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #5a6a8a;
            font-size: 0.85rem;
        }
        
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        
        /* 로딩 애니메이션 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 반응형 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .speed-value {
                font-size: 3rem;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎸 Slow Practice</h1>
            <p>느리게 연습하고, 정확하게 치자</p>
        </div>
        
        <!-- 업로드 섹션 -->
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🎵</div>
                <div class="upload-text">음원 파일을 드래그하거나 클릭</div>
                <div class="upload-hint">mp3, wav 지원</div>
                <input type="file" id="fileInput" accept="audio/*">
            </div>
            <div class="file-info" id="fileInfo">
                <span class="file-name" id="fileName"></span>
            </div>
        </div>
        
        <!-- 속도 조절 섹션 -->
        <div class="card speed-section" id="speedSection">
            <div class="section-title">⚡ 속도 조절</div>
            <div class="speed-display">
                <span class="speed-value" id="speedValue">75</span>
                <span class="speed-unit">%</span>
            </div>
            <div class="speed-controls">
                <button class="speed-btn" id="speedDown">−</button>
                <input type="range" class="speed-slider" id="speedSlider" min="50" max="100" value="75">
                <button class="speed-btn" id="speedUp">+</button>
            </div>
            <div class="preset-btns">
                <button class="preset-btn" data-speed="50">50%</button>
                <button class="preset-btn" data-speed="60">60%</button>
                <button class="preset-btn" data-speed="70">70%</button>
                <button class="preset-btn active" data-speed="75">75%</button>
                <button class="preset-btn" data-speed="80">80%</button>
                <button class="preset-btn" data-speed="90">90%</button>
                <button class="preset-btn" data-speed="100">100%</button>
            </div>
        </div>
        
        <!-- 플레이어 섹션 -->
        <div class="card player-section" id="playerSection">
            <button class="play-btn" id="playBtn" disabled>
                <span id="playIcon">▶</span>
                <span id="playText">재생</span>
            </button>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            
            <button class="download-btn" id="downloadBtn" disabled>
                💾 변환된 음원 다운로드
            </button>
            
            <div class="status" id="status"></div>
        </div>
        
        <div class="footer">
            <p>유튜브 영상은 mp3로 변환 후 업로드하세요</p>
            <p>Made for practice · Free · 🎸</p>
        </div>
    </div>
    
    <!-- SoundTouch.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/soundtouch-js/0.1.30/soundtouch.min.js"></script>
    
    <script>
        // 상태 관리
        let audioContext = null;
        let originalBuffer = null;
        let stretchedBuffer = null;
        let sourceNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let currentSpeed = 75;
        let animationId = null;
        
        // DOM 요소
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const speedSection = document.getElementById('speedSection');
        const playerSection = document.getElementById('playerSection');
        const speedValue = document.getElementById('speedValue');
        const speedSlider = document.getElementById('speedSlider');
        const speedDown = document.getElementById('speedDown');
        const speedUp = document.getElementById('speedUp');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const status = document.getElementById('status');
        
        // 초기화
        function init() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        // 파일 업로드 이벤트
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                handleFile(file);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        // 파일 처리
        async function handleFile(file) {
            if (!audioContext) init();
            
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            speedSection.classList.add('show');
            playerSection.classList.add('show');
            
            setStatus('파일 로딩 중...', 'processing');
            playBtn.disabled = true;
            downloadBtn.disabled = true;
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                originalBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                setStatus('');
                await processAudio();
            } catch (err) {
                setStatus('파일을 읽을 수 없습니다', 'error');
                console.error(err);
            }
        }
        
        // 오디오 처리 (속도 변환)
        async function processAudio() {
            if (!originalBuffer) return;
            
            setStatus('변환 중...', 'processing');
            playBtn.disabled = true;
            downloadBtn.disabled = true;
            
            // 재생 중이면 정지
            if (isPlaying) {
                stopAudio();
            }
            
            try {
                const tempo = currentSpeed / 100;
                stretchedBuffer = await timeStretch(originalBuffer, tempo);
                
                totalTimeEl.textContent = formatTime(stretchedBuffer.duration);
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                pauseTime = 0;
                
                setStatus('');
                playBtn.disabled = false;
                downloadBtn.disabled = false;
            } catch (err) {
                setStatus('변환 실패', 'error');
                console.error(err);
            }
        }
        
        // SoundTouch 타임 스트레치
        function timeStretch(buffer, tempo) {
            return new Promise((resolve) => {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const originalLength = buffer.length;
                const newLength = Math.round(originalLength / tempo);
                
                // SoundTouch 설정
                const soundTouch = new SoundTouch();
                soundTouch.tempo = tempo;
                soundTouch.pitch = 1.0;
                
                // 새 버퍼 생성
                const newBuffer = audioContext.createBuffer(
                    numChannels,
                    newLength,
                    sampleRate
                );
                
                // 각 채널 처리
                for (let channel = 0; channel < numChannels; channel++) {
                    const inputData = buffer.getChannelData(channel);
                    const outputData = newBuffer.getChannelData(channel);
                    
                    // SimpleFilter 사용
                    const source = {
                        extract: function(target, numFrames, position) {
                            const start = position;
                            const end = Math.min(position + numFrames, inputData.length);
                            const extracted = end - start;
                            
                            for (let i = 0; i < extracted; i++) {
                                target[i] = inputData[start + i];
                            }
                            
                            return extracted;
                        }
                    };
                    
                    const filter = new SimpleFilter(source, soundTouch);
                    
                    // 출력 추출
                    let outputPos = 0;
                    const tempBuffer = new Float32Array(4096);
                    
                    while (outputPos < newLength) {
                        const framesExtracted = filter.extract(tempBuffer, Math.min(4096, newLength - outputPos));
                        if (framesExtracted === 0) break;
                        
                        for (let i = 0; i < framesExtracted && outputPos < newLength; i++) {
                            outputData[outputPos++] = tempBuffer[i];
                        }
                    }
                }
                
                resolve(newBuffer);
            });
        }
        
        // 속도 조절 이벤트
        speedSlider.addEventListener('input', (e) => {
            setSpeed(parseInt(e.target.value));
        });
        
        speedDown.addEventListener('click', () => {
            if (currentSpeed > 50) {
                setSpeed(currentSpeed - 1);
            }
        });
        
        speedUp.addEventListener('click', () => {
            if (currentSpeed < 100) {
                setSpeed(currentSpeed + 1);
            }
        });
        
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setSpeed(parseInt(btn.dataset.speed));
            });
        });
        
        function setSpeed(speed) {
            currentSpeed = speed;
            speedValue.textContent = speed;
            speedSlider.value = speed;
            
            // 프리셋 버튼 활성화
            presetBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.speed) === speed);
            });
            
            // 오디오 재처리
            if (originalBuffer) {
                processAudio();
            }
        }
        
        // 재생/정지
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });
        
        function playAudio() {
            if (!stretchedBuffer) return;
            
            // AudioContext 재개 (브라우저 정책)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = stretchedBuffer;
            sourceNode.connect(audioContext.destination);
            
            sourceNode.onended = () => {
                if (isPlaying) {
                    stopAudio();
                }
            };
            
            startTime = audioContext.currentTime - pauseTime;
            sourceNode.start(0, pauseTime);
            
            isPlaying = true;
            playBtn.classList.add('playing');
            playIcon.textContent = '⏸';
            playText.textContent = '정지';
            
            updateProgress();
        }
        
        function pauseAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }
            
            pauseTime = audioContext.currentTime - startTime;
            
            isPlaying = false;
            playBtn.classList.remove('playing');
            playIcon.textContent = '▶';
            playText.textContent = '재생';
            
            cancelAnimationFrame(animationId);
        }
        
        function stopAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }
            
            pauseTime = 0;
            isPlaying = false;
            playBtn.classList.remove('playing');
            playIcon.textContent = '▶';
            playText.textContent = '재생';
            
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            
            cancelAnimationFrame(animationId);
        }
        
        function updateProgress() {
            if (!isPlaying || !stretchedBuffer) return;
            
            const elapsed = audioContext.currentTime - startTime;
            const duration = stretchedBuffer.duration;
            const progress = Math.min(elapsed / duration * 100, 100);
            
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(elapsed);
            
            if (elapsed < duration) {
                animationId = requestAnimationFrame(updateProgress);
            }
        }
        
        // 다운로드
        downloadBtn.addEventListener('click', async () => {
            if (!stretchedBuffer) return;
            
            setStatus('WAV 파일 생성 중...', 'processing');
            downloadBtn.disabled = true;
            
            try {
                const wavBlob = await bufferToWav(stretchedBuffer);
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `slow_${currentSpeed}pct_${fileName.textContent.replace(/\.[^/.]+$/, '')}.wav`;
                a.click();
                URL.revokeObjectURL(url);
                
                setStatus('다운로드 완료!');
                setTimeout(() => setStatus(''), 2000);
            } catch (err) {
                setStatus('다운로드 실패', 'error');
                console.error(err);
            }
            
            downloadBtn.disabled = false;
        });
        
        // AudioBuffer를 WAV로 변환
        function bufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            
            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;
            
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);
            
            // WAV 헤더 작성
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);
            
            // 오디오 데이터 작성
            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }
            
            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    const sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, intSample, true);
                    offset += 2;
                }
            }
            
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }
        
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
        
        // 유틸리티
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function setStatus(text, type = '') {
            status.textContent = text;
            status.className = 'status ' + type;
        }
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
