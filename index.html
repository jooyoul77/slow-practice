<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎸 Slow Practice (Debug Mode)</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; line-height: 1.6; }
    .container { max-width: 550px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    #progressContainer { width: 100%; background: #eee; height: 20px; border-radius: 10px; margin: 20px 0; display: none; overflow: hidden; }
    #progressBar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.1s; }
    
    /* 디버그 로그 스타일 */
    #debugConsole { 
      text-align: left; background: #1a1a1a; color: #00ff00; padding: 15px; 
      font-family: 'Courier New', monospace; font-size: 12px; height: 180px; 
      overflow-y: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #444;
    }
    
    button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status-text { font-weight: bold; color: #2c3e50; margin-top: 10px; }
    #downloadBtn { display: none; margin-top: 20px; background: #e74c3c; padding: 15px; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎸 Slow Practice</h2>
  <p style="font-size: 14px; color: #666;">디버깅 모드가 활성화되었습니다.</p>
  
  <input type="file" id="fileInput" accept="audio/*" style="width: 100%; margin-bottom: 20px;">
  
  <div style="margin-bottom: 20px;">
    속도: 
    <select id="speedSelect" style="padding: 8px; width: 120px;">
      <option value="0.5">50%</option>
      <option value="0.7" selected>70%</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
    </select>
  </div>

  <button id="convertBtn">변환 프로세스 시작</button>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <p id="status" class="status-text">파일을 선택해 주세요</p>
  
  <div id="debugConsole">--- System Ready (Debug Log) ---<br></div>
  
  <a id="downloadBtn">⬇ 변환 완료! MP3 다운로드</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/soundtouchjs@0.1.30/dist/soundtouch.min.js"></script>

<script>
const logEl = document.getElementById('debugConsole');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');

// [디버그 전용] 로그 출력 함수
function log(msg) {
  const time = new Date().toLocaleTimeString();
  logEl.innerHTML += `[${time}] ${msg}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[ST_DEBUG] ${msg}`);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

convertBtn.onclick = async () => {
  log("버튼 클릭됨. 프로세스 검사 시작...");
  
  // 1. 라이브러리 로드 상태 체크
  const isLameLoaded = typeof lamejs !== 'undefined';
  const isSTLoaded = typeof soundtouch !== 'undefined';
  
  log(`LameJS 로드 상태: ${isLameLoaded ? 'OK' : 'FAIL'}`);
  log(`SoundTouchJS 로드 상태: ${isSTLoaded ? 'OK' : 'FAIL'}`);

  if (!isLameLoaded || !isSTLoaded) {
    log("!!! 치명적 오류: 라이브러리를 찾을 수 없습니다. 인터넷 연결 혹은 CDN 차단 여부를 확인하세요.");
    alert("라이브러리 로드에 실패했습니다. 로그창의 내용을 확인하세요.");
    return;
  }

  const file = document.getElementById('fileInput').files[0];
  if (!file) {
    log("경고: 파일이 선택되지 않았습니다.");
    alert("파일을 선택해주세요.");
    return;
  }

  try {
    convertBtn.disabled = true;
    downloadBtn.style.display = 'none';
    progressContainer.style.display = 'block';
    
    log(`파일 정보: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`);
    statusEl.textContent = "오디오 디코딩 중...";
    
    const startTime = performance.now();
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    log(`디코딩 완료. 재생시간: ${audioBuffer.duration.toFixed(2)}초 (소요: ${((performance.now() - startTime)/1000).toFixed(2)}s)`);

    const rate = parseFloat(document.getElementById('speedSelect').value);
    log(`설정 속도: ${rate}x`);

    // 2. 속도 변환 (SoundTouch)
    statusEl.textContent = "속도 변환 작업 중 (1/2)...";
    const stStart = performance.now();
    const processedBuffer = await runSoundTouch(audioBuffer, rate);
    log(`속도 변환 완료 (소요: ${((performance.now() - stStart)/1000).toFixed(2)}s)`);

    // 3. MP3 인코딩 (Lame)
    statusEl.textContent = "MP3 압축 및 인코딩 중 (2/2)...";
    const lameStart = performance.now();
    const mp3Blob = await runLameEncoding(processedBuffer);
    log(`MP3 인코딩 완료 (소요: ${((performance.now() - lameStart)/1000).toFixed(2)}s)`);

    const url = URL.createObjectURL(mp3Blob);
    downloadBtn.href = url;
    downloadBtn.download = `slowed_${rate}_${file.name}`;
    downloadBtn.style.display = 'block';
    statusEl.textContent = "모든 작업 완료 ✅";
    log("성공: 파일이 생성되었습니다. 다운로드 버튼을 누르세요.");
    convertBtn.disabled = false;

  } catch (err) {
    log(`!!! 실행 오류: ${err.message}`);
    console.error(err);
    statusEl.textContent = "오류가 발생했습니다.";
    convertBtn.disabled = false;
  }
};

async function runSoundTouch(buffer, rate) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const st = new soundtouch.SoundTouch(sampleRate);
  st.tempo = rate;

  const source = {
    extract: (target, numFrames, offset) => {
      for (let i = 0; i < numFrames; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          target[i * numChannels + ch] = buffer.getChannelData(ch)[i + offset] || 0;
        }
      }
      return Math.min(numFrames, buffer.length - offset);
    }
  };

  const filter = new soundtouch.SimpleFilter(source, st);
  const outLength = Math.ceil(buffer.length / rate);
  const outputData = new Float32Array(outLength * numChannels);
  
  let totalFrames = 0;
  const BUF_SIZE = 4096;
  const temp = new Float32Array(BUF_SIZE * numChannels);

  while (true) {
    const frames = filter.extract(temp, BUF_SIZE);
    if (frames === 0) break;
    outputData.set(temp.subarray(0, frames * numChannels), totalFrames * numChannels);
    totalFrames += frames;

    if (totalFrames % 50000 === 0) {
      const p = (totalFrames / outLength) * 50; // 전체의 50% 담당
      progressBar.style.width = p + '%';
      await new Promise(r => setTimeout(r, 0));
    }
    if (totalFrames >= outLength) break;
  }

  const outBuffer = audioCtx.createBuffer(numChannels, totalFrames, sampleRate);
  for (let ch = 0; ch < numChannels; ch++) {
    const channelData = outBuffer.getChannelData(ch);
    for (let i = 0; i < totalFrames; i++) {
      channelData[i] = outputData[i * numChannels + ch];
    }
  }
  return outBuffer;
}

async function runLameEncoding(buffer) {
  const channels = buffer.numberOfChannels;
  const encoder = new lamejs.Mp3Encoder(channels, buffer.sampleRate, 128);
  const mp3Data = [];
  const left = buffer.getChannelData(0);
  const right = channels > 1 ? buffer.getChannelData(1) : left;
  const blockSize = 1152;

  for (let i = 0; i < left.length; i += blockSize) {
    const l = new Int16Array(blockSize);
    const r = new Int16Array(blockSize);
    for (let j = 0; j < blockSize; j++) {
      l[j] = left[i+j] * 0x7FFF;
      r[j] = right[i+j] * 0x7FFF;
    }
    const mp3buf = encoder.encodeBuffer(l, r);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);

    if (i % 100000 === 0) {
      const p = 50 + (i / left.length * 50); // 50~100% 담당
      progressBar.style.width = p + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }
  mp3Data.push(encoder.flush());
  return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
