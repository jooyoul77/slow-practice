<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🎸 Slow Practice</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 40px auto;
      text-align: center;
    }
    button, select {
      font-size: 16px;
      margin-top: 12px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <h2>🎸 Slow Practice</h2>

  <input type="file" id="fileInput" accept="audio/*"><br>

  <label>
    속도:
    <select id="speed">
      <option value="0.5">50%</option>
      <option value="0.6">60%</option>
      <option value="0.7">70%</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="1.0" selected>100%</option>
    </select>
  </label><br>

  <button id="processBtn">변환 후 재생 ▶</button>

  <p style="font-size: 13px; color: #666;">
    ※ 유튜브 영상은 mp3로 변환 후 업로드하세요
  </p>

  <script src="https://unpkg.com/soundtouchjs/dist/soundtouch.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const speedSelect = document.getElementById('speed');
    const processBtn = document.getElementById('processBtn');

    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let sourceBuffer = null;

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      sourceBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      alert('음원 로드 완료');
    };

    processBtn.onclick = async () => {
      if (!sourceBuffer) {
        alert('음원을 먼저 업로드하세요');
        return;
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const speed = parseFloat(speedSelect.value);
      const channels = sourceBuffer.numberOfChannels;
      const length = sourceBuffer.length;
      const sampleRate = sourceBuffer.sampleRate;

      const left = sourceBuffer.getChannelData(0);
      const right = channels > 1
        ? sourceBuffer.getChannelData(1)
        : left;

      const st = new soundtouch.SoundTouch(sampleRate);
      st.tempo = speed;

      const source = {
        extract: function (target, numFrames, position) {
          for (let i = 0; i < numFrames; i++) {
            target[i * 2]     = left[position + i] || 0;
            target[i * 2 + 1] = right[position + i] || 0;
          }
          return numFrames;
        }
      };

      const filter = new soundtouch.SimpleFilter(source, st);

      const processed = [];
      const bufferSize = 4096;
      let frames;

      do {
        const temp = new Float32Array(bufferSize * 2);
        frames = filter.extract(temp, bufferSize);
        if (frames > 0) {
          processed.push(temp.slice(0, frames * 2));
        }
      } while (frames > 0);

      const totalLength = processed.reduce((sum, b) => sum + b.length, 0);
      const outputBuffer = audioCtx.createBuffer(
        2,
        totalLength / 2,
        sampleRate
      );

      const outL = outputBuffer.getChannelData(0);
      const outR = outputBuffer.getChannelData(1);

      let offset = 0;
      for (const chunk of processed) {
        for (let i = 0; i < chunk.length / 2; i++) {
          outL[offset + i] = chunk[i * 2];
          outR[offset + i] = chunk[i * 2 + 1];
        }
        offset += chunk.length / 2;
      }

      const src = audioCtx.createBufferSource();
      src.buffer = outputBuffer;
      src.connect(audioCtx.destination);
      src.start();

    };
  </script>

</body>
</html>
